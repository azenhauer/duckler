name: Security and regression checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit, integration and cross-user isolation tests
        run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Runtime dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high
