<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Duckler Capture Settings</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header><div><strong>Duckler Capture</strong><span>Settings</span></div></header>
      <form id="settings-form">
        <label for="app-url">Duckler app URL</label>
        <input id="app-url" type="url" placeholder="http://localhost:5176/" required>
        <p>Captured items open in Duckler through this URL. Use an HTTP(S) address.</p>
        <button class="primary" type="submit">Save settings</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
