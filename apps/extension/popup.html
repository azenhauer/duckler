<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Duckler Capture</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header class="brand"><span class="extension-mark" role="img" aria-label="Duckler Capture"></span><button id="settings" class="settings-link" type="button" aria-label="Extension settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-.6 2-2 .9-2-.4-2 3.5 1.4 1.6v2.8L2.4 15l2 3.5 2-.4 2 .9.6 2h4l.6-2 2-.9 2 .4 2-3.5-1.4-1.6v-2.8l1.4-1.6-2-3.5-2 .4-2-.9-.6-2Z"/><circle cx="11" cy="12" r="3"/></svg><span>Settings</span></button></header>
<nav class="tabs" aria-label="Capture panel"><button type="button" class="tab active" data-tab="save" aria-pressed="true">Capture</button><button type="button" class="tab" data-tab="queue" aria-pressed="false">Pending <span id="queue-count">0</span></button></nav>
<section id="save-panel">
<div class="page-preview"><span id="page-domain" class="eyebrow">CURRENT PAGE</span><h1 id="page-title">Loading page…</h1><blockquote id="selection-preview" hidden></blockquote><span class="preview-kind" id="preview-kind">Link</span></div>
<div class="capture-modes"><button id="mode-page" class="mode active" aria-pressed="true">Link</button><button id="mode-selection" class="mode" aria-pressed="false">Highlight</button><button id="mode-note" class="mode" aria-pressed="false">Note</button></div>
<label class="visually-hidden" for="note-text">Add a note</label><textarea id="note-text" maxlength="100000" rows="3" placeholder="What caught your eye? (optional)"></textarea>
<label class="tag-field"><span>Tags</span><input id="tags" maxlength="500" placeholder="design, inspiration…"></label>
<div class="save-actions"><button id="save-page" class="save-button" type="button">Save link</button><button id="capture-region" class="region-button" type="button" title="Capture region · Alt+Shift+D" aria-label="Capture a region of this page">▧</button></div>
<p class="quiet-hint">Saved here first. Delivered when your library opens.</p></section>
<section id="queue-panel" hidden><p id="queue-summary" class="quiet-hint"></p><ul id="queue-list"></ul><button id="export-queue" class="subtle-button">Export pending captures</button></section>
<p id="status" role="status" aria-live="polite"></p>
<footer><button id="connection-status" type="button" aria-label="Connection settings">Connect library</button><button id="open-library" type="button">Open library ↗</button></footer>
</main><script src="popup.js"></script></body></html>
